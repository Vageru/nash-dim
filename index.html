<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Наш дім</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ⚙️ Кольори беруться з теми Telegram; запасні значення – для перегляду в браузері */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111114);
    --hint: var(--tg-theme-hint-color, #8a8a93);
    --accent: var(--tg-theme-button-color, #2f7bf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #2f7bf6);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --sep: rgba(127, 127, 140, .18);
    --ok: #2fa86b;
    --warn: #e0912c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #101014);
      --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1c1c22));
      --text: var(--tg-theme-text-color, #f2f2f5);
      --hint: var(--tg-theme-hint-color, #8d8d99);
    }
  }
  /* перегляд поза Telegram: тема, яку задає сторінка-переглядач */
  :root[data-theme=dark] { --bg: #101014; --card: #1c1c22; --text: #f2f2f5; --hint: #8d8d99; }
  :root[data-theme=light] { --bg: #f1f1f4; --card: #ffffff; --text: #111114; --hint: #8a8a93; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  [hidden] { display: none !important; }

  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 50; transition: width .3s; }
  #bar.on { width: 70%; transition: width 2s ease-out; }

  main { padding: 12px 12px 84px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 6px 4px 12px; display: flex; align-items: center; justify-content: space-between; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--hint); margin: 20px 16px 6px; }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .card + .card { margin-top: 10px; }
  .pad { padding: 14px 16px; }
  .hint { color: var(--hint); font-size: 14px; }
  .small { font-size: 13px; }
  .empty { text-align: center; padding: 28px 20px; color: var(--hint); }
  .empty b { display: block; font-size: 32px; margin-bottom: 6px; }

  /* перемикачі */
  .seg { display: flex; background: var(--sep); border-radius: 11px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--hint); white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg .cnt { font-size: 12px; opacity: .7; margin-left: 3px; }

  /* рядки списків */
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--sep); }
  .row .main { flex: 1; min-width: 0; }
  .row .title { overflow-wrap: anywhere; }
  .row .sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .row .right { text-align: right; white-space: nowrap; }
  .tap { cursor: pointer; }
  .tap:active { background: var(--sep); }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--hint); flex: none; display: grid; place-items: center; font-size: 14px; color: #fff; }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .done .title { text-decoration: line-through; color: var(--hint); }
  .icon { width: 36px; height: 36px; border-radius: 10px; background: var(--sep); display: grid; place-items: center; font-size: 19px; flex: none; }

  .add { display: flex; gap: 8px; margin-bottom: 12px; }
  .add input, .add textarea { flex: 1; border: 0; background: var(--card); border-radius: 12px; padding: 13px 14px; outline: none; min-width: 0; }
  .add textarea { resize: none; overflow: hidden; line-height: 1.35; min-height: 48px; max-height: 40vh; display: block; }
  .add { align-items: stretch; }
  .add button { min-height: 48px; }
  .add button { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 0 18px; font-size: 22px; font-weight: 600; }

  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.light { background: var(--sep); color: var(--text); }
  .btn.ghost { color: var(--link); }
  .btn.danger { color: var(--danger); }
  .btn + .btn { margin-top: 8px; }
  .btn:disabled { opacity: .5; }
  .link { color: var(--link); font-size: 15px; font-weight: 500; }

  .chip { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 20px; background: var(--sep); color: var(--hint); }
  .chip.ok { background: rgba(47,168,107,.15); color: var(--ok); }
  .chip.warn { background: rgba(224,145,44,.15); color: var(--warn); }
  .chip.bad { background: rgba(229,72,77,.14); color: var(--danger); }

  .balance { text-align: center; padding: 18px 16px; }
  .balance .who { font-size: 15px; color: var(--hint); }
  .balance .sum { font-size: 32px; font-weight: 700; margin: 4px 0 12px; }
  .bars .b { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 14px; }
  .bars .track { flex: 1; height: 6px; border-radius: 3px; background: var(--sep); overflow: hidden; }
  .bars .fill { height: 100%; background: var(--accent); border-radius: 3px; }

  .fab { position: fixed; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom)); background: var(--accent); color: var(--accent-text);
    border-radius: 28px; padding: 14px 20px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.22); z-index: 5; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--sep);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; color: var(--hint); }
  nav.tabs button span { font-size: 22px; filter: grayscale(1); opacity: .7; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs button.on span { filter: none; opacity: 1; }

  /* нижня шторка */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #backdrop.on { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--bg); z-index: 21;
    border-radius: 18px 18px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease, visibility 0s .25s; visibility: hidden; }
  #sheet.on { transform: none; visibility: visible; transition: transform .25s ease; }
  #sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--sep); margin: 2px auto 10px; }
  #sheet h3 { margin: 4px 0 14px; font-size: 20px; text-align: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--hint); margin: 0 4px 6px; }
  .field input, .field select { width: 100%; border: 0; background: var(--card); border-radius: 12px; padding: 13px 14px; outline: none; -webkit-appearance: none; appearance: none; min-height: 48px; }
  .field .note { font-size: 12px; color: var(--hint); margin: 5px 4px 0; }
  .amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; background: var(--card); border-radius: 14px; padding: 10px; }
  .amount input { width: 100%; max-width: 220px; border: 0; background: none; font-size: 38px; font-weight: 700; text-align: right; outline: none; padding: 0; min-height: 0; }
  .amount span { font-size: 22px; color: var(--hint); }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .cats button { background: var(--card); border-radius: 11px; padding: 9px 4px; font-size: 13px; border: 2px solid transparent; }
  .cats button.on { border-color: var(--accent); }
  .cats button b { display: block; font-size: 20px; font-weight: 400; }
  .switch { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .switch .t { flex: 1; }
  .switch .t small { display: block; color: var(--hint); font-size: 12px; }
  .switch i { width: 44px; height: 26px; border-radius: 13px; background: var(--sep); position: relative; flex: none; transition: background .2s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch.on i { background: var(--ok); }
  .switch.on i::after { left: 21px; }
  .info { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .info .big { font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }

  .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--sep); flex: none; display: grid; place-items: center; font-size: 20px; }
  img.thumb { display: block; }
  .add .cam { background: var(--card); color: var(--text); font-size: 20px; padding: 0 14px; }
  .add .cam.on { background: var(--ok); color: #fff; }
  .pending { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 8px; margin: -4px 0 12px; }
  .pending img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
  .pending .x { margin-left: auto; color: var(--danger); padding: 8px 12px; }
  .preview { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 14px; background: var(--card); display: block; margin-bottom: 12px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 30; display: none; align-items: center; justify-content: center; }
  #viewer.on { display: flex; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .cap { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); color: #fff; text-align: center; padding: 0 20px; font-size: 15px; }
  nav.tabs button { position: relative; }
  .badge { position: absolute; top: 0; left: 50%; margin-left: 8px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff;
    font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
  .mono { border: 2px solid var(--accent); }
  .mono .head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 2px; }
  .mono .acts { display: flex; gap: 6px; padding: 0 16px 12px 64px; }
  .mono .acts button { flex: 1; background: var(--sep); border-radius: 10px; padding: 8px 4px; font-size: 13px; font-weight: 600; }
  .mono .acts button.x { flex: 0 0 44px; }
  .mono .row + .acts { margin-top: -6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips span { background: var(--card); border-radius: 16px; padding: 6px 6px 6px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
  .chips button { color: var(--hint); padding: 0 6px; font-size: 16px; }
  .steps { margin: 0 0 14px; padding-left: 20px; }
  .steps li { margin-bottom: 6px; }
  #toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -20px); background: rgba(30,30,35,.92); color: #fff;
    padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 40; pointer-events: none; max-width: 86vw; text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #sync { position: fixed; right: 10px; top: calc(8px + env(safe-area-inset-top)); z-index: 35; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 14px;
    background: var(--card); color: var(--hint); box-shadow: 0 1px 4px rgba(0,0,0,.12); opacity: 0; transform: translateY(-8px); transition: all .2s; pointer-events: none; }
  #sync.on { opacity: 1; transform: none; }
  #sync.ok { color: var(--ok); }
  #sync.bad { color: var(--warn); }
  .split .seg { margin-bottom: 8px; }
  .split .calc { font-size: 13px; color: var(--hint); margin: 0 4px; }
  .sub .sh { color: var(--accent); }
  .demo { background: rgba(224,145,44,.15); color: var(--warn); font-size: 13px; text-align: center; padding: 8px; border-radius: 10px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="bar"></div>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="lists"><span>🛒</span>Покупки</button>
  <button data-tab="cal"><span>📅</span>Календар</button>
  <button data-tab="money"><span>💸</span>Гроші</button>
</nav>
<div id="backdrop"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="sync"></div>
<div id="viewer"><img alt=""><div class="cap"></div></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script>
/* ===================== НАЛАШТУВАННЯ ===================== */
// Вставте сюди URL розгортання Apps Script (той самий, що WEBAPP_URL, закінчується на /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxvh_6TuXciVZGEDBpVUwWO4AERV1qrk2O-IHMkKiOR9QBtCgNWVK18ecrCe2IemYdwKw/exec';

/* ===================== ОСНОВА ===================== */
const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = !tg || !tg.initData;
let S = null;                 // те, що бачимо: стан сервера + ще не надіслані зміни
let SERVER = null;            // останній стан, який прийшов із сервера
let tab = 'lists', listTab = 'shop';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const WD = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const MONTHS_GEN = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
const pad = n => String(n).padStart(2, '0');
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
const fmtD = dt => dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
const addDays = (s, n) => { const d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return fmtD(d); };
const dayDiff = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
function human(s) { const d = parseD(s); return WD[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS_GEN[d.getUTCMonth()]; }
function rel(s) {
  const diff = dayDiff(s, S.today);
  if (diff === 0) return 'Сьогодні';
  if (diff === 1) return 'Завтра';
  return human(s)[0].toUpperCase() + human(s).slice(1);
}
function money(n) {
  const r = Math.round(Number(n)); // без копійок
  const [i, f] = (Math.abs(r) % 1 ? Math.abs(r).toFixed(2) : String(Math.abs(r))).split('.');
  return (r < 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (f ? ',' + f : '') + ' грн';
}
function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }

/* ===================== ЧЕРГА ЗМІН ===================== */
// Кожна дія одразу видна на екрані, а на сервер летить пачкою трохи згодом.
// Черга лежить у пам'яті телефона: якщо зв'язок зник чи застосунок закрили – надішлеться пізніше.
const UID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'demo';
const LS_Q = 'nd_q_' + UID, LS_S = 'nd_s_' + UID;
const store = (k, v) => { if (DEMO) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const load = k => { if (DEMO) return null; try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const newId = () => 'c' + Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 8);
const num = v => Number(String(v == null ? '' : v).replace(',', '.').replace(/\s/g, ''));
let Q = load(LS_Q) || [];
let inflight = false, flushT = null, firstQueued = 0, retryMs = 0, netDown = false, savedT = null, lastSync = 0;
const CREATES = { item_add: 'id', event_add: 'id', off_add: 'id', exp_add: 'id', pay_add: 'id', loan_add: 'id', pay_paid: 'expId', mono_decide: 'expId' };
const DIRECT = ['mono_connect', 'mono_disconnect', 'item_set_photo', 'item_remove_photo'];

function rebuild() {
  if (!SERVER) return;
  S = clone(SERVER);
  S.money.moves = S.money.moves || [];
  S.money.breakdown = S.money.breakdown || [];
  Q.forEach(op => { try { LOCAL[op.action] && LOCAL[op.action](S, op.data); } catch (e) {} });
}
/** Додає зміну: одразу на екран, на сервер – пачкою */
function enqueue(action, data, delay = 1200) {
  data = Object.assign({}, data);
  if (CREATES[action] && !data[CREATES[action]]) data[CREATES[action]] = newId();
  Q.push({ opId: newId(), action, data });
  store(LS_Q, Q);
  if (!firstQueued) firstQueued = Date.now();
  try { LOCAL[action] && LOCAL[action](S, data); } catch (e) {}
  render(); status();
  // не чекаємо вічно, якщо людина клацає без зупинки
  schedule(Date.now() - firstQueued > 5000 ? 0 : delay);
  return data;
}
function schedule(ms) { clearTimeout(flushT); flushT = setTimeout(flush, ms); }
async function post(body, keepalive) {
  if (DEMO) { await sleep(350); return demoServer(body); }
  const r = await fetch(API_URL, { method: 'POST', keepalive: !!keepalive, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ api: 1, initData: tg.initData }, body)) });
  return r.json();
}
function authFail(res) {
  if (res.error === 'not_member') { fatal('Спершу приєднайтесь у боті', 'Напишіть боту /start і код доступу, потім відкрийте застосунок ще раз'); return true; }
  if (res.error === 'auth') { fatal('Не вдалося перевірити вхід', 'Закрийте й відкрийте застосунок ще раз з Telegram'); return true; }
  return false;
}
/** Надсилає накопичені зміни (або просто оновлює стан, якщо черга порожня) */
async function flush(keepalive) {
  if (inflight) { schedule(300); return; }
  clearTimeout(flushT);
  inflight = true; firstQueued = 0; status();
  const ops = Q.slice(0, 40);
  try {
    const res = await post({ action: 'batch', data: { ops } }, keepalive);
    if (!res.ok) { if (authFail(res)) return; throw new Error(res.error || 'error'); }
    const done = {};
    (res.results || []).forEach(r => {
      done[r.opId] = 1;
      if (!r.ok) { haptic('error'); toast(r.error); }
    });
    Q = Q.filter(o => !done[o.opId]); store(LS_Q, Q);
    SERVER = res.state; store(LS_S, SERVER);
    lastSync = Date.now(); netDown = false; retryMs = 0;
    if (ops.length && !Q.length) { clearTimeout(savedT); savedT = setTimeout(() => { savedT = null; status(); }, 1600); }
    rebuild(); render();
    if (Q.length) schedule(50);
  } catch (e) {
    netDown = true; retryMs = Math.min(30000, (retryMs || 1500) * 2);
    if (!SERVER) $('#view').innerHTML = '<div class="empty" style="padding-top:80px">Немає зв\'язку з ботом<br>Пробую ще раз…</div>';
    schedule(retryMs);
  } finally { inflight = false; status(); }
}
function status() {
  const el = $('#sync');
  $('#bar').classList.toggle('on', inflight && Q.length > 0);
  if (Q.length && netDown) { el.className = 'on bad'; el.textContent = '⚠️ Немає зв\'язку – збережу пізніше'; }
  else if (Q.length) { el.className = 'on'; el.textContent = 'Зберігається…'; }
  else if (savedT) { el.className = 'on ok'; el.textContent = 'Збережено ✓'; }
  else el.className = '';
}

/* ---- як кожна зміна виглядає на екрані ще до відповіді сервера ---- */
const myName = st => st.me ? st.me.name : 'Я';
const pName = st => st.partner ? st.partner.name : 'Партнер';
const catIcon = (st, n) => (st.cats.find(c => c.name === n) || { icon: '📦' }).icon;
function netOf(st) { const b = st.money.balance; return b ? (b.iOwe ? -b.amount : b.amount) : 0; } // > 0: партнер винен мені
function setNet(st, n) {
  n = Math.round(n * 100) / 100;
  st.money.balance = Math.abs(n) < 0.01 ? null
    : n > 0 ? { from: pName(st), to: myName(st), amount: n, iOwe: false } : { from: myName(st), to: pName(st), amount: -n, iOwe: true };
}
function shareFrom(amount, split, share) { return split === 'all' ? amount : split === 'none' ? 0 : split === 'custom' ? num(share) : null; }
function expNet(e) { if (e.personal) return 0; const s = e.share != null ? Number(e.share) : e.amount / 2; return e.mine ? s : -s; }
function catAdd(st, name, d) {
  const m = st.money; let c = m.byCat.find(x => x.name === name);
  if (!c) { c = { name, icon: catIcon(st, name), sum: 0 }; m.byCat.push(c); }
  c.sum += d; m.byCat = m.byCat.filter(x => x.sum > 0.001).sort((a, b) => b.sum - a.sum);
}
function addExp(st, e) {
  if (e.date.slice(0, 7) === st.today.slice(0, 7)) {
    st.money.expenses.unshift(e); st.money.total += e.amount;
    if (e.personal) st.money.personal = (st.money.personal || 0) + e.amount; else st.money.shared = (st.money.shared || 0) + e.amount;
    catAdd(st, e.category, e.amount);
  }
  setNet(st, netOf(st) + expNet(e));
  if (!e.personal && expNet(e)) bdPush(st, bdOfExp(e));
}
/* розшифровка боргу: які записи його склали */
function bdPush(st, x) {
  const b = st.money.breakdown = st.money.breakdown || [];
  b.push(x);
  if (Math.abs(netOf(st)) < 1) st.money.breakdown = [];
}
function bdDrop(st, id) { st.money.breakdown = (st.money.breakdown || []).filter(x => x.id !== id); }
function bdOfExp(e) { return { id: e.id, date: e.date, kind: 'shared', icon: e.icon, title: e.note || e.category, amount: e.amount, payer: e.who, mine: e.mine, share: e.share, net: expNet(e) }; }
function sortCal(st) { st.calendar.sort((x, y) => (x.date + (x.time || '99')) < (y.date + (y.time || '99')) ? -1 : 1); }
function payLeft(st, day) {
  const [y, m, d] = st.today.split('-').map(Number);
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return Math.min(day, dim) - d;
}
const LOCAL = {
  item_add(st, d) { if (!st.items.some(i => i.id === d.id)) st.items.push({ id: d.id, list: d.list, text: d.text, done: false, author: myName(st) }); },
  item_set_done(st, d) { const i = st.items.find(x => x.id === d.id); if (i) i.done = !!d.done; },
  item_edit(st, d) { const i = st.items.find(x => x.id === d.id); if (i) i.text = d.text.trim(); },
  item_delete(st, d) { st.items = st.items.filter(i => i.id !== d.id); },
  items_clear(st, d) { st.items = st.items.filter(i => !(i.list === d.list && i.done)); },
  event_add(st, d) { st.calendar.push({ type: 'event', id: d.id, date: d.date, time: d.time || '', title: d.title.trim(), who: myName(st), mine: true }); sortCal(st); },
  off_add(st, d) {
    const who = d.who === 'partner' ? pName(st) : myName(st);
    for (let c = d.date, i = 0; c <= (d.date_to || d.date) && i < 62; c = addDays(c, 1), i++)
      st.calendar.push({ type: 'off', id: d.id + '_' + i, date: c, time: '', title: d.note || '', who, mine: d.who !== 'partner' });
    sortCal(st);
  },
  cal_delete(st, d) { st.calendar = st.calendar.filter(c => !(c.type === d.type && c.id === d.id)); },
  exp_add(st, d) {
    const amount = num(d.amount), personal = !!d.personal, mine = personal || d.payer !== 'partner', cat = d.category || 'інше';
    addExp(st, { id: d.id, date: d.date || st.today, amount, category: cat, icon: catIcon(st, cat), note: (d.note || '').trim(),
      who: mine ? myName(st) : pName(st), personal, mine, share: personal ? null : shareFrom(amount, d.split, d.share) });
  },
  exp_delete(st, d) {
    const m = st.money, e = m.expenses.find(x => x.id === d.id); if (!e) return;
    m.expenses = m.expenses.filter(x => x !== e); m.total -= e.amount;
    if (e.personal) m.personal -= e.amount; else m.shared -= e.amount;
    catAdd(st, e.category, -e.amount);
    setNet(st, netOf(st) - expNet(e)); bdDrop(st, e.id);
  },
  exp_personal(st, d) {
    const m = st.money, e = m.expenses.find(x => x.id === d.id); if (!e || !e.mine) return;
    const before = expNet(e); e.personal = !e.personal;
    if (e.personal) { m.personal += e.amount; m.shared -= e.amount; } else { m.personal -= e.amount; m.shared += e.amount; }
    setNet(st, netOf(st) - before + expNet(e));
    if (e.personal || !expNet(e)) bdDrop(st, e.id); else bdPush(st, bdOfExp(e));
  },
  exp_set_share(st, d) {
    const e = st.money.expenses.find(x => x.id === d.id); if (!e || e.personal) return;
    const before = expNet(e); e.share = shareFrom(e.amount, d.split, d.share);
    setNet(st, netOf(st) - before + expNet(e));
    const x = (st.money.breakdown || []).find(y => y.id === e.id);
    if (!expNet(e)) { bdDrop(st, e.id); if (Math.abs(netOf(st)) < 1) st.money.breakdown = []; }
    else if (x) { x.share = e.share; x.net = expNet(e); if (Math.abs(netOf(st)) < 1) st.money.breakdown = []; } else bdPush(st, bdOfExp(e));
  },
  loan_add(st, d) {
    const a = num(d.amount), fromMe = d.dir !== 'partner_to_me';
    st.money.moves.unshift({ id: d.id, kind: 'loan', date: d.date || st.today, amount: a, from: fromMe ? myName(st) : pName(st), to: fromMe ? pName(st) : myName(st), note: (d.note || '').trim() });
    setNet(st, netOf(st) + (fromMe ? a : -a));
    bdPush(st, { id: d.id, date: d.date || st.today, kind: 'loan', icon: '💸', title: 'Позика' + (d.note && d.note.trim() ? ': ' + d.note.trim() : ''), amount: a,
      payer: fromMe ? myName(st) : pName(st), mine: fromMe, share: null, net: fromMe ? a : -a });
  },
  move_delete(st, d) {
    const mv = st.money.moves.find(x => x.id === d.id); if (!mv) return;
    st.money.moves = st.money.moves.filter(x => x !== mv);
    setNet(st, netOf(st) - (mv.from === myName(st) ? mv.amount : -mv.amount)); bdDrop(st, mv.id);
  },
  settle(st) {
    const b = st.money.balance; if (!b) return;
    st.money.moves.unshift({ id: 'tmp' + newId(), kind: 'settle', date: st.today, amount: b.amount, from: b.from, to: b.to, note: 'розрахунок' });
    st.money.balance = null; st.money.breakdown = [];
  },
  pay_add(st, d) {
    const amount = String(d.amount || '').trim() === '' ? null : num(d.amount), day = Number(d.day);
    st.money.payments.push({ id: d.id, title: d.title.trim(), day, amount, who: d.who, whoName: d.who === 'me' ? myName(st) : d.who === 'partner' ? pName(st) : '',
      category: d.category, paid: false, left: payLeft(st, day) });
    st.money.payments.sort((a, b) => a.day - b.day);
  },
  pay_paid(st, d) {
    const p = st.money.payments.find(x => x.id === d.id); if (!p) return;
    p.paid = true;
    const amount = num(d.amount);
    if (amount > 0) {
      const mine = d.payer !== 'partner', cat = p.category || 'комуналка';
      addExp(st, { id: d.expId, date: st.today, amount, category: cat, icon: catIcon(st, cat), note: p.title, who: mine ? myName(st) : pName(st),
        personal: false, mine, share: shareFrom(amount, d.split, d.share) });
    }
  },
  pay_unpaid(st, d) { const p = st.money.payments.find(x => x.id === d.id); if (p) p.paid = false; },
  pay_delete(st, d) { st.money.payments = st.money.payments.filter(p => p.id !== d.id); },
  mono_decide(st, d) {
    const mono = st.money.mono; if (!mono) return;

/** Зменшує фото до ~1280 px і стискає в JPEG, щоб швидко вантажилось */
function shrink(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не вдалося прочитати фото')); };
    img.src = url;
  });
}
/** Відкриває вибір фото (камера або галерея) і повертає зменшене фото */
function pickPhoto() {
  return new Promise(resolve => {
    const inp = $('#filePick');
    inp.value = '';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return resolve(null);
      try { resolve(await shrink(f)); } catch (e) { toast(e.message); resolve(null); }
    };
    inp.click();
  });
}

}
function setThumb(el, src) {

  const moves = (m.moves || []).map(x => `
    <div class="row tap" data-move="${esc(x.id)}">

      <div class="right">${money(x.amount)}</div>

  const mono = m.mono || { connected: false, pending: [] };
  const pending = mono.pending.map(p => `
    <div class="row tap" data-mono="${esc(p.txid)}">

  return `

/* ===================== ПОДІЇ ===================== */
function bindView() {
  $$('[data-list]').forEach(b => b.onclick = () => { listTab = b.dataset.list; render(); });
  $$('[data-view]').forEach(b => b.onclick = ev => { ev.stopPropagation(); viewPhoto(b.dataset.view); });
  const f = $('#addItem');
  if (f) {
    const ta = $('#itemText');
    ta.oninput = () => grow(ta);
    // на комп'ютері Enter додає, Shift+Enter – новий рядок; на телефоні Enter – новий рядок
    ta.onkeydown = ev => { if (ev.key === 'Enter' && !ev.shiftKey && !('ontouchstart' in window)) { ev.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.onsubmit(ev); } };
    f.onsubmit = async ev => {
      ev.preventDefault();
      const raw = ta.value;
      const withPhoto = pendingPhoto && listTab !== 'shop';
      if (withPhoto) {
        const t = raw.replace(/\s+/g, ' ').trim();
        if (!t) { toast('Напишіть, що це'); return; }
        if (await direct('item_add', { list: listTab, text: t, photo: pendingPhoto })) { pendingPhoto = null; $('#itemText').value = ''; render(); }
        return;
      }
      const parts = raw.split(/[\n,;]+/).map(x => x.replace(/^[\s•\-–*]+|\s+$/g, '').replace(/\s+/g, ' ')).filter(Boolean).map(x => x.slice(0, 120));
      if (!parts.length) return;
      ta.value = ''; grow(ta);
      parts.forEach(t => enqueue('item_add', { list: listTab, text: t }));
      try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {}
      if (parts.length > 1) toast('Додано ' + parts.length + ' пунктів');
      setTimeout(() => $('#itemText') && $('#itemText').focus(), 30);
    };
  }
  const cam = $('#addCam');
  if (cam) cam.onclick = async () => {
    const keep = $('#itemText').value;
    const p = await pickPhoto();
    if (p) { pendingPhoto = p; render(); $('#itemText').value = keep; $('#itemText').focus(); }
  };
  const dp = $('#dropPhoto'); if (dp) dp.onclick = () => { pendingPhoto = null; render(); };
  $$('[data-toggle]').forEach(b => b.onclick = () => {
    const it = S.items.find(i => i.id === b.dataset.toggle); if (!it) return;
    try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {}
    enqueue('item_set_done', { id: it.id, done: !it.done });
  });
  $$('[data-item]').forEach(b => b.onclick = () => sheetItem(b.dataset.item));
  const cd = $('#clearDone'); if (cd) cd.onclick = () => enqueue('items_clear', { list: listTab }, 300);
  $$('[data-cal]').forEach(b => b.onclick = () => { const [t, id] = b.dataset.cal.split(':'); sheetCal(t, id); });
  $$('[data-pay]').forEach(b => b.onclick = () => sheetPay(b.dataset.pay));
  $$('[data-exp]').forEach(b => b.onclick = () => sheetExp(b.dataset.exp));
  $$('[data-mono]').forEach(b => b.onclick = () => sheetMono(b.dataset.mono));
  $$('[data-md]').forEach(b => b.onclick = () => { const [kind, txid] = b.dataset.md.split(/:(.*)/s); haptic('success'); enqueue('mono_decide', { txid, kind }, 600); });
  $$('[data-move]').forEach(b => b.onclick = () => sheetMove(b.dataset.move));
  $$('[data-open]').forEach(b => b.onclick = () => ({ calAdd: sheetCalAdd, expAdd: () => sheetExpAdd('once'), settle: sheetSettle, mono: sheetMonoSettings, breakdown: sheetBreakdown })[b.dataset.open]());
}
$$('nav.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; window.scrollTo(0, 0); render();
  if (Date.now() - lastSync > 30000) refresh(); // підтягнути зміни партнера й нові покупки з mono
});
if (tg && tg.onEvent) tg.onEvent('activated', refresh);
// застосунок згортають – пробуємо одразу дослати зміни (а якщо не вийде, вони чекають у черзі на телефоні)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && Q.length && !inflight) flush(true);
  if (document.visibilityState === 'visible') refresh();
});
window.addEventListener('online', refresh);

/* ===================== ШТОРКИ ===================== */
function openSheet(html, bind) {
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#backdrop').classList.add('on'); $('#sheet').classList.add('on');
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
  bind && bind($('#sheet'));
}
function askConfirm(text, yes) {
  if (DEMO) return yes(); // у демо без підтвердження
  if (tg && tg.showConfirm) tg.showConfirm(text, ok => { if (ok) yes(); });
  else if (window.confirm(text)) yes();
}
function closeSheet() {
  $('#backdrop').classList.remove('on'); $('#sheet').classList.remove('on');
  if (tg && tg.BackButton) { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); }
  document.activeElement && document.activeElement.blur();
}
$('#backdrop').onclick = closeSheet;

function seg(name, opts, val) {
  return `<div class="seg" data-seg="${name}">` + opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${v === val ? 'on' : ''}">${t}</button>`).join('') + `</div>`;
}
function segVal(root, name) { const b = root.querySelector(`[data-seg="${name}"] .on`); return b ? b.dataset.v : ''; }
function bindSegs(root, onChange) {
  $$('[data-seg] button', root).forEach(b => b.onclick = () => {
    $$('button', b.parentNode).forEach(x => x.classList.toggle('on', x === b));
    onChange && onChange(b.parentNode.dataset.seg, b.dataset.v);
  });
}
function cats(selected) {
  return `<div class="cats">` + S.cats.map(c => `<button type="button" data-cat="${esc(c.name)}" class="${c.name === selected ? 'on' : ''}"><b>${c.icon}</b>${esc(c.name)}</button>`).join('') + `</div>`;
}
function bindCats(root) { $$('[data-cat]', root).forEach(b => b.onclick = () => { $$('[data-cat]', root).forEach(x => x.classList.toggle('on', x === b)); }); }
function catVal(root) { const b = root.querySelector('[data-cat].on'); return b ? b.dataset.cat : 'інше'; }
const partnerName = () => S.partner ? S.partner.name : 'Партнер';
async function submit(btn, action, data, msg) {
  if (DIRECT.indexOf(action) >= 0) {
    btn.disabled = true;
    const ok = await direct(action, data);
    btn.disabled = false;
    if (ok) closeSheet();
    return;
  }
  const err = VALID[action] ? VALID[action](S, data) : '';
  if (err) { haptic('error'); toast(err); return; }
  enqueue(action, data, 400);
  closeSheet(); haptic('success');
  if (msg) toast(msg);
}
/* --- хто скільки закриває --- */
function splitField(id, payerMe, amount, cur) {
  // cur: null – навпіл, число – своя сума (або все)
  const split = cur == null ? 'half' : Number(cur) === 0 ? 'none' : amount != null && Number(cur) === Number(amount) ? 'all' : 'custom';
  return `<div class="field split" id="${id}">
    <label data-split-label>${splitLabel(payerMe)}</label>
    ${seg('split', [['half', 'Навпіл'], ['all', 'Усю'], ['custom', 'Свою'], ['none', 'Нічого']], split)}
    <div class="amount" data-custom ${split === 'custom' ? '' : 'hidden'} style="padding:6px 10px"><input data-share inputmode="decimal" placeholder="0" value="${split === 'custom' ? esc(cur) : ''}" style="font-size:26px"><span>грн</span></div>
    <div class="calc" data-calc></div></div>`;
}
function splitLabel(payerMe) { return payerMe ? 'Скільки з цього закриває ' + esc(partnerName()) : 'Скільки з цього закриваєте ви'; }
function bindSplit(box, getAmount, getPayerMe) {
  const upd = () => {
    const sp = segVal(box, 'split'), a = getAmount(), me = getPayerMe();
    $('[data-split-label]', box).innerHTML = splitLabel(me);
    $('[data-custom]', box).hidden = sp !== 'custom';
    const who = me ? esc(partnerName()) : 'ви';
    let t = '';
    if (a > 0) {
      const sh = sp === 'all' ? a : sp === 'none' ? 0 : sp === 'custom' ? num($('[data-share]', box).value) : a / 2;
      if (sh === 0 && (sp === 'none' || $('[data-share]', box).value.trim() !== '')) t = 'Без поділу: витрату видно обом, різниця не змінюється';
      else if (!isNaN(sh) && sh > 0 && sh <= a) t = (me ? who + ' → вам ' : 'ви → ' + esc(partnerName()) + ' ') + money(sh) + (sp === 'custom' && sh > 0 && sh < a ? ' · решта ' + money(a - sh) + ' на ' + (me ? 'вас' : esc(partnerName())) : '');
    }
    $('[data-calc]', box).innerHTML = t;
  };
  $$('[data-seg="split"] button', box).forEach(b => b.addEventListener('click', () => { setTimeout(upd, 0); if (b.dataset.v === 'custom') setTimeout(() => $('[data-share]', box).focus(), 50); }));
  $('[data-share]', box).oninput = upd;
  upd();
  return upd;
}
function moreWrap(inner, label = 'Більше') {
  return `<button type="button" class="link" data-more style="display:block;margin:-4px 4px 12px;font-size:15px">${label} ›</button><div data-more-box hidden>${inner}</div>`;
}
function bindMore(r) {
  $$('[data-more]', r).forEach(b => b.onclick = () => { b.hidden = true; b.nextElementSibling.hidden = false; });
}
function readSplit(box) {
  const split = segVal(box, 'split');
  return split === 'custom' ? { split, share: $('[data-share]', box).value.replace(',', '.').trim() } : { split };
}

function sheetItem(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  openSheet(`
    <h3>${LIST_NAMES[it.list][0]} Змінити</h3>
    ${it.photo ? `<img class="preview" id="pv" src="${FULLS[id] || THUMBS[id] || ''}" alt="">` : ''}
    <div class="field"><label>Назва</label><input id="t" value="${esc(it.text)}"></div>
    <button class="btn primary" id="save">Зберегти</button>
    <button class="btn light" id="photo">📷 ${it.photo ? 'Змінити фото' : 'Додати фото'}</button>
    ${it.photo ? '<button class="btn ghost" id="nophoto">Прибрати фото</button>' : ''}
    <button class="btn danger" id="del">Видалити</button>`, r => {
    $('#save', r).onclick = e => submit(e.target, 'item_edit', { id, text: $('#t', r).value });
    $('#del', r).onclick = e => submit(e.target, 'item_delete', { id }, 'Видалено');
    $('#photo', r).onclick = async e => {
      const p = await pickPhoto(); if (!p) return;
      delete THUMBS[id]; delete FULLS[id];
      submit(e.target, 'item_set_photo', { id, photo: p });
    };
    if (it.photo) {
      $('#nophoto', r).onclick = e => { delete THUMBS[id]; delete FULLS[id]; submit(e.target, 'item_remove_photo', { id }); };
      $('#pv', r).onclick = () => viewPhoto(id);
      if (!FULLS[id]) apiRaw('photo_get', { id, size: 'full' }).then(x => { if (x.ok) { FULLS[id] = x.data; const pv = $('#pv'); if (pv) pv.src = x.data; } });
    }
  });
}

    case 'state': return { ok: true, state: clone(D) };
    case 'item_add':
      if (d.photo) { if (!d.text.trim()) return err('Напишіть назву'); D.items.push({ id: uid(), list: d.list, text: d.text.trim(), done: false, author: D.me.name, photo: true, _src: d.photo }); return { ok: true, msg: 'Додано з фото', state: clone(D) }; }
      d.text.split(/[,\n]/).map(s => s.trim()).filter(Boolean).forEach(t => D.items.push({ id: uid(), list: d.list, text: t, done: false, author: D.me.name })); return { ok: true, msg: 'Додано', state: clone(D) };
    case 'item_toggle': return { ok: true, state: clone(D) };
    case 'item_edit': D.items.find(i => i.id === d.id).text = d.text; return { ok: true, msg: 'Збережено', state: clone(D) };
    case 'item_delete': D.items = D.items.filter(i => i.id !== d.id); return { ok: true, msg: 'Видалено', state: clone(D) };
    case 'items_clear': D.items = D.items.filter(i => !(i.list === d.list && i.done)); return { ok: true, msg: 'Прибрано', state: clone(D) };
    case 'item_photo': return { ok: true, msg: 'Фото надіслано в чат з ботом', state: clone(D) };
    case 'photo_get': { const it = D.items.find(i => i.id === d.id); return it ? { ok: true, data: it._src || DEMO_IMG } : err('Фото не знайдено'); }
    case 'item_set_photo': { const it = D.items.find(i => i.id === d.id); it.photo = true; it._src = d.photo; return { ok: true, msg: 'Фото збережено', state: clone(D) }; }
    case 'item_remove_photo': { const it = D.items.find(i => i.id === d.id); it.photo = false; delete it._src; return { ok: true, msg: 'Фото прибрано', state: clone(D) }; }
    case 'event_add':
      if (!d.title.trim()) return err('Напишіть, що за подія');
      D.calendar.push({ type: 'event', id: uid(), date: d.date, time: d.time, title: d.title, who: D.me.name }); D.calendar.sort((x, y) => (x.date + (x.time || '99')) < (y.date + (y.time || '99')) ? -1 : 1);
      return { ok: true, msg: 'Подію додано', state: clone(D) };
    case 'off_add': {
      const who = d.who === 'partner' ? D.partner.name : D.me.name;
      for (let c = d.date, i = 0; c <= (d.date_to || d.date) && i < 62; c = addDays(c, 1), i++) D.calendar.push({ type: 'off', id: uid(), date: c, time: '', title: d.note, who });
      D.calendar.sort((x, y) => x.date < y.date ? -1 : 1);
      return { ok: true, msg: 'Вихідні додано', state: clone(D) };
    }
    case 'cal_delete': D.calendar = D.calendar.filter(c => c.id !== d.id); return { ok: true, msg: 'Видалено', state: clone(D) };
    case 'exp_add': {
      const amt = Number(d.amount); if (!(amt > 0)) return err('Вкажіть суму');
      D.money.expenses.unshift({ id: uid(), date: d.date, amount: amt, category: d.category, icon: catIcon(d.category), note: d.note, who: d.personal || d.payer === 'me' ? D.me.name : D.partner.name, personal: d.personal, mine: d.personal || d.payer === 'me' });
      D.money.total += amt; if (d.personal) D.money.personal += amt;
      return { ok: true, msg: 'Витрату додано', state: clone(D) };
    }
    case 'exp_delete': D.money.expenses = D.money.expenses.filter(e => e.id !== d.id); return { ok: true, msg: 'Видалено', state: clone(D) };
    case 'exp_personal': { const e = D.money.expenses.find(x => x.id === d.id); e.personal = !e.personal; return { ok: true, state: clone(D) }; }
    case 'settle': D.money.balance = null; return { ok: true, msg: 'Записано', state: clone(D) };
    case 'pay_add':
      if (!d.title.trim()) return err('Напишіть назву');
      D.money.payments.push({ id: uid(), title: d.title, day: Number(d.day), amount: d.amount ? Number(d.amount) : null, who: d.who, whoName: d.who === 'me' ? D.me.name : d.who === 'partner' ? D.partner.name : '', category: d.category, paid: false, left: 5 });
      return { ok: true, msg: 'Платіж додано', state: clone(D) };
    case 'pay_paid': D.money.payments.find(p => p.id === d.id).paid = true; return { ok: true, msg: 'Оплачено', state: clone(D) };
    case 'pay_unpaid': D.money.payments.find(p => p.id === d.id).paid = false; return { ok: true, msg: 'Позначку знято', state: clone(D) };
    case 'mono_decide': {
      const p = D.money.mono.pending.find(x => x.txid === d.txid); if (!p) return err('Час на вибір минув');
      D.money.mono.pending = D.money.mono.pending.filter(x => x !== p);
      if (d.kind === 'x') return { ok: true, msg: 'Видалено 🙈', state: clone(D) };
      if (d.kind === 'a' && D.money.mono.auto.indexOf(p.desc.toLowerCase()) < 0) D.money.mono.auto.push(p.desc.toLowerCase());
      const cat = d.category || p.category;
      D.money.expenses.unshift({ id: uid(), date: p.date, amount: p.amount, category: cat, icon: catIcon(cat), note: p.desc, who: D.me.name, personal: d.kind === 'p', mine: true });
      D.money.total += p.amount; if (d.kind === 'p') D.money.personal += p.amount;
      return { ok: true, msg: d.kind === 'p' ? 'Записано як особисту 🔒' : 'Записано як спільну 👥', state: clone(D) };
    }
    case 'mono_connect': if ((d.token || '').length < 20) return err('Вставте токен повністю'); D.money.mono.connected = true; return { ok: true, msg: 'monobank підключено', state: clone(D) };
    case 'mono_settings': D.money.mono.ttl = d.ttl; D.money.mono.auto = d.auto; return { ok: true, msg: 'Збережено', state: clone(D) };
    case 'mono_disconnect': D.money.mono = { connected: false, cards: [], ttl: 3, auto: [], pending: [] }; return { ok: true, msg: 'monobank відключено', state: clone(D) };
    case 'pay_delete': D.money.payments = D.money.payments.filter(p => p.id !== d.id); return { ok: true, msg: 'Видалено', state: clone(D) };
  }
  return err('Невідома дія');
}

/* ===================== СТАРТ ===================== */
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
if (!DEMO && API_URL.indexOf('http') !== 0) fatal('Застосунок не налаштовано', 'Вставте URL Apps Script у змінну API_URL в index.html');
else {
  SERVER = load(LS_S);
  if (SERVER && SERVER.money) { rebuild(); render(); }  // показуємо одразу останнє збережене, свіже підтягнеться за секунду
  else { SERVER = null; $('#view').innerHTML = '<div class="empty" style="padding-top:80px">Завантаження…</div>'; }
  flush();
}
</script>
</body>
</html>
